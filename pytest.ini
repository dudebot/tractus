# Repo-root pytest configuration for the CI guardrail slice.
#
# The two package suites (tractus_engine_advanced/, tractus_controller/)
# have their own pyproject.toml [tool.pytest.ini_options]. This file
# scopes the *workspace-level* tests/ directory — currently just the CI
# guardrail meta-suite under tests/ci/.
#
# Run from the repo root with:
#   pytest -q tests/
# or via:
#   make ci

[pytest]
testpaths = tests
addopts = -ra
markers =
    cheat_channel: cheat-channel ablation gate (5-20%% Goldilocks; ARCH §540-543)
    frication_physical: frication physical-derivation gate (ARCH §1684-1685)
    full_ablation: full inversion-driven ablation (off PR critical path; nightly slice)
